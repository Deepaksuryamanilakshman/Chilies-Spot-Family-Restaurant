<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background disc gradient -->
    <linearGradient id="discBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241E1A"/>
      <stop offset="100%" stop-color="#120F0D"/>
    </linearGradient>
    
    <!-- Warm gold & amber metallic rim -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7C978"/>
      <stop offset="40%" stop-color="#D66B32"/>
      <stop offset="80%" stop-color="#B52A1D"/>
      <stop offset="100%" stop-color="#E5A93C"/>
    </linearGradient>

    <!-- Warm interior fiery ember glow -->
    <radialGradient id="emberGlow" cx="48%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#E52E20" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#D66B32" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#120F0D" stop-opacity="0"/>
    </radialGradient>

    <!-- Rich chili red gradient (deep shadow to vibrant crimson) -->
    <linearGradient id="chiliGrad" x1="15%" y1="10%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#FF4D2D"/>
      <stop offset="35%" stop-color="#E52414"/>
      <stop offset="75%" stop-color="#A51408"/>
      <stop offset="100%" stop-color="#670A02"/>
    </linearGradient>

    <!-- Glossy chili shine highlight -->
    <linearGradient id="shineGrad" x1="20%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#FF7A45" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF2A14" stop-opacity="0"/>
    </linearGradient>

    <!-- Fresh green stem & calyx gradient -->
    <linearGradient id="stemGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#68D391"/>
      <stop offset="40%" stop-color="#38A169"/>
      <stop offset="80%" stop-color="#22543D"/>
      <stop offset="100%" stop-color="#1A3628"/>
    </linearGradient>

    <!-- Drop shadow for depth -->
    <filter id="chiliShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#E52E20" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Circular Emblem Disc -->
  <circle cx="50" cy="50" r="46" fill="url(#discBg)" stroke="url(#goldRim)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#D8C7AC" stroke-opacity="0.15" stroke-width="0.8" stroke-dasharray="2 2"/>
  <circle cx="50" cy="50" r="44" fill="url(#emberGlow)"/>

  <!-- Chili Mark Group -->
  <g filter="url(#chiliShadow)">
    <!-- Main Chili Pepper Body -->
    <path d="M 54 28 C 63 32, 68 43, 65 55 C 62 67, 52 76, 40 81 C 36.5 82.2, 33.5 81, 33 78 C 32.5 75, 35 71, 39 67 C 45 61, 48 51, 47 42 C 46.5 35, 43 30, 41 27.5 C 45 26.5, 50 26.8, 54 28 Z"
          fill="url(#chiliGrad)"/>

    <!-- Glossy Highlight Contour -->
    <path d="M 53 31 C 60 35, 63.5 44, 61 54 C 58 63, 50 71, 41 75.5 C 43.5 72, 49 66.5, 52 58 C 55 49, 53 39, 49 32.5 C 50.5 31.8, 51.8 31.3, 53 31 Z"
          fill="url(#shineGrad)"/>

    <!-- Secondary Soft Underbelly Warmth -->
    <path d="M 37 66 C 34.5 69, 34 73, 34.8 75.5 C 36.5 75.8, 39 74.5, 42 71 C 40 70, 38.5 68, 37 66 Z"
          fill="#FF7A45"
          opacity="0.4"/>

    <!-- Green Calyx / Cap with sepal leaves gripping the chili crown -->
    <path d="M 39 27 C 42 28.5, 44 26, 47 26.5 C 50 27, 51.5 28.5, 54.5 28 C 56 27.8, 57.5 29, 57 30.5 C 54.5 31.5, 52 30, 49 32 C 46 30.5, 43 31.5, 40 30 C 38.5 29.2, 38 27.8, 39 27 Z"
          fill="url(#stemGrad)"/>

    <!-- Curved Stem arching gracefully at the top -->
    <path d="M 47 26.5 C 46 20, 42 14.5, 35 12 C 33.8 11.6, 34.5 10.2, 36 10.5 C 43.5 12, 49 17.5, 50 26.5 Z"
          fill="url(#stemGrad)"/>

    <!-- Playful Fresh Little Leaf on stem -->
    <path d="M 42 17 C 38 15, 36 18, 39 19.5 C 41 20.5, 43 19, 42 17 Z"
          fill="#68D391"/>

    <!-- Decorative Culinary Star Sparkle (Top-right) -->
    <path d="M 68 22 Q 70.5 22, 70.5 19.5 Q 70.5 22, 73 22 Q 70.5 22, 70.5 24.5 Q 70.5 22, 68 22 Z"
          fill="#F7C978"/>

    <!-- Small Golden Glow Dots -->
    <circle cx="28" cy="40" r="1.5" fill="#F7C978" opacity="0.65"/>
    <circle cx="71" cy="46" r="1.2" fill="#D66B32" opacity="0.5"/>
  </g>
</svg>
